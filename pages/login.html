<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Cyberfus</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/login.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js" type="module"></script>
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-box">
            <h1 class="logo">Cyberfus</h1>
            <div id="sign-in-container">
                <h2>Sign in to your account</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
                <p class="toggle-link">Don't have an account? <a href="#" id="show-signup">Sign up</a></p>
            </div>

            <div id="sign-up-container" style="display: none;">
                <h2>Create a new account</h2>
                <form id="signup-form">
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>
                <p class="toggle-link">Already have an account? <a href="#" id="show-signin">Sign in</a></p>
            </div>
        </div>
    </div>

    <script src="../js/firebase-config.js" type="module"></script>
    <script src="../js/login.js" type="module"></script>
</body>
</html>
