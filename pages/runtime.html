<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runtime Shield – Cyberfus</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js" type="module"></script>
</head>
<body class="dashboard-body">

    <aside class="dashboard-sidebar">
        <div class="logo">Cyberfus</div>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li class="active"><a href="runtime.html">Runtime</a></li>
                <li><a href="ai-gate.html">AI Gate</a></li>
                <li><a href="#">Secrets</a></li>
                <li><a href="#">Identity</a></li>
                <li><a href="#">Supply Chain</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </nav>
        <div class="user-profile">
            <button id="logout-btn" class="btn btn-secondary">Log out</button>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-header">
            <h1>Runtime Shield</h1>
            <button id="simulate-event-btn" class="btn btn-primary">Simulate Event</button>
        </header>
        <div class="dashboard-grid">
            <div class="dashboard-card full-width">
                <h3>Real-time Events</h3>
                <table class="events-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Type</th>
                            <th>Source IP</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="events-log">
                        <!-- Events will be dynamically inserted here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="../js/firebase-config.js" type="module"></script>
    <script src="../js/dashboard.js" type="module"></script>
    <script src="../js/runtime.js" type="module"></script>
</body>
</html>
